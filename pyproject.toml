[project]
name = "uca-rag-langgraph"
version = "0.1.0"
description = "Two-step hybrid RAG pipeline for STPA unsafe control action generation"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
retrieval = [
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0.0",
  "ddgs>=9.0.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "langchain-text-splitters>=0.3.0",
]
terminology = [
  "transformers>=4.45.0",
  "torch>=2.4.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
uca-rag = "uca_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uca_rag*"]
